[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# QIE mainnet (chain 1990) has PUSH0 but no Cancun opcodes (MCOPY and TSTORE are rejected: script/mainnet-probe.sh), so target shanghai.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000

[fmt]
line_length = 120
