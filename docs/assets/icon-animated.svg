<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Patungan — Seat five of five fills, and the court owner is paid in that same transaction: PAID IN FULL. Three seats are ticked in carbon blue, then the vermilion stamp lands across the roster and stays.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-8%     steady state: the paper slip (navy outline, torn zigzag top), title bar, three ruled empty rows  (poster rule: brand visible)
  8-38%    trigger:      names are written into rows 1-3 in ballpoint navy, each gets a carbon-blue HELD tick      data-story="beat-2"
  38-55%   mechanism:    Seat five of five fills, and the court owner is paid in that same transaction: PAID IN FULL.
           (the vermilion stamp slams across the roster with a ripple and a jolt of the slip)                   data-story="beat-3"
  55-80%   resolution:   the stamp stays; a red glow breathes once under it                                       data-story="beat-4"
  80-100%  breathe + seam fade: story fades 95.5-98.5%, the empty slip returns
-->
<style>
  [data-story] { pointer-events: none; }
  .slam { transform-box: fill-box; transform-origin: center; animation: slam 6s linear infinite; }
  .jolt { animation: jolt 6s linear infinite; }
  @keyframes slam { 0%, 39.5% { opacity: 0; transform: scale(2.1); } 41% { opacity: 1; transform: scale(0.9); } 42.3% { opacity: 1; transform: scale(1.05); }
    43.6%, 95.5% { opacity: 0.95; transform: scale(1); } 98.5%, 100% { opacity: 0; transform: scale(1); } }
  @keyframes jolt { 0%, 40.6% { transform: translate(0, 0); } 41.2% { transform: translate(0, 7px); } 42.2% { transform: translate(0, -3px); } 43.2%, 100% { transform: translate(0, 0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .slam { opacity: 0.95; } }
</style>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#F4EEDF"/></linearGradient>
  <linearGradient id="inkline" gradientUnits="userSpaceOnUse" x1="166" y1="0" x2="262" y2="0"><stop offset="0" stop-color="#1D2A47"/><stop offset="1" stop-color="#2D5BA6"/></linearGradient>
  <filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<g class="jolt">
  <path d="M120 92 L137 72 L154 92 L171 72 L188 92 L205 72 L222 92 L239 72 L256 92 L273 72 L290 92 L307 72 L324 92 L341 72 L358 92 L375 72 L392 92 L392 418 Q392 448 362 448 L150 448 Q120 448 120 418 Z" fill="url(#paper)" stroke="#1D2A47" stroke-width="20" stroke-linejoin="round"/>
  <rect x="160" y="124" width="136" height="22" rx="11" fill="#1D2A47"/>
  <rect x="160" y="156" width="78" height="10" rx="5" fill="#6E6A5E" opacity="0.55"/>
  <g stroke-linecap="round"><line x1="156" y1="222" x2="356" y2="222" stroke="#DCD2BC" stroke-width="4"/><line x1="156" y1="274" x2="356" y2="274" stroke="#DCD2BC" stroke-width="4"/><line x1="156" y1="326" x2="356" y2="326" stroke="#DCD2BC" stroke-width="4"/></g>
  <g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.955;0.985;1" values="1;1;0;0"/>
    
      <line data-story="beat-2" x1="166" y1="200" x2="262" y2="200" stroke="url(#inkline)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" keyTimes="0;0.1;0.15;1" values="102;102;0;0"/></line>
      <path data-story="beat-2" d="M300 199 l11 11 l25 -26" fill="none" stroke="#2D5BA6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" keyTimes="0;0.135;0.17;1" values="102;102;0;0"/></path>
      <line data-story="beat-2" x1="166" y1="252" x2="240" y2="252" stroke="url(#inkline)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" keyTimes="0;0.2;0.25;1" values="102;102;0;0"/></line>
      <path data-story="beat-2" d="M300 251 l11 11 l25 -26" fill="none" stroke="#2D5BA6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" keyTimes="0;0.235;0.27;1" values="102;102;0;0"/></path>
      <line data-story="beat-2" x1="166" y1="304" x2="252" y2="304" stroke="url(#inkline)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" keyTimes="0;0.3;0.35;1" values="102;102;0;0"/></line>
      <path data-story="beat-2" d="M300 303 l11 11 l25 -26" fill="none" stroke="#2D5BA6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="102"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" keyTimes="0;0.335;0.37;1" values="102;102;0;0"/></path>
    <rect data-story="beat-4" x="190" y="340" width="226" height="88" rx="14" fill="#C23A2E" opacity="0" filter="url(#glow)" transform="rotate(-8 300 384)"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.56;0.68;0.8;1" values="0;0;0.32;0;0"/></rect>
    <g transform="rotate(-8 300 384)"><g class="slam" data-story="beat-3" opacity="0"><g filter="url(#ink)">
      <rect x="184" y="336" width="236" height="96" rx="12" fill="#FFFDF7" stroke="#C23A2E" stroke-width="12"/>
      <rect x="200" y="352" width="204" height="64" rx="6" fill="none" stroke="#C23A2E" stroke-width="5"/>
      <path d="M250 384 l24 22 l58 -46" fill="none" stroke="#C23A2E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g></g>
    <circle data-story="beat-3" cx="302" cy="384" r="20" fill="none" stroke="#C23A2E" stroke-width="6" opacity="0"><animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.412;0.49;1" values="20;20;210;210"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.412;0.42;0.49;1" values="0;0;0.55;0;0"/></circle>
  </g>
</g>
