<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" role="img" aria-labelledby="t d">
<title id="t">Patungan architecture</title>
<desc id="d">A member joins with QUSDC or QIE. QIE is swapped to QUSDC through QIEDEX, bounded by the QIE Oracle. Patungan escrows QUSDC. The last seat pays the payee, resolved through Zone .qie names. A pool past its deadline refunds every member.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
<rect width="960" height="470" fill="#fafaf7"/>
<g fill="#fff" stroke="#334155" stroke-width="1.5">
<rect x="30" y="170" width="150" height="70" rx="8"/>
<rect x="300" y="30" width="190" height="70" rx="8"/>
<rect x="300" y="170" width="190" height="90" rx="8" fill="#e8f1ff" stroke="#1d4ed8" stroke-width="2.5"/>
<rect x="300" y="340" width="190" height="70" rx="8"/>
<rect x="640" y="30" width="190" height="70" rx="8"/>
<rect x="640" y="170" width="190" height="70" rx="8"/>
<rect x="640" y="340" width="190" height="70" rx="8"/>
</g>
<g fill="#0f172a" text-anchor="middle">
<text x="105" y="200" font-weight="700">Member wallet</text><text x="105" y="220" font-size="12">QIE or QUSDC</text>
<text x="395" y="58" font-weight="700">QIEDEX router</text><text x="395" y="78" font-size="12">WQIE/QUSDC pair</text>
<text x="395" y="200" font-weight="700" font-size="16">Patungan escrow</text><text x="395" y="222" font-size="12">one contract, every pool</text><text x="395" y="240" font-size="12">seats × price in QUSDC</text>
<text x="395" y="368" font-weight="700">QUSDC</text><text x="395" y="388" font-size="12">escrow token, transferFrom</text>
<text x="735" y="58" font-weight="700">QIE Oracle</text><text x="735" y="78" font-size="12">QIE/USDT guard (view)</text>
<text x="735" y="198" font-weight="700">Payee</text><text x="735" y="218" font-size="12">address or .qie name</text>
<text x="735" y="368" font-weight="700">Members (refund)</text><text x="735" y="388" font-size="12">after deadline or cancel</text>
</g>
<g stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)">
<path d="M180 195 L300 195"/><path d="M180 215 L300 215" stroke-dasharray="5 4"/>
<path d="M395 170 L395 100"/><path d="M395 100 L395 168" stroke-dasharray="5 4"/>
<path d="M640 65 L490 65"/><path d="M490 235 L640 205"/>
<path d="M395 260 L395 340"/><path d="M490 380 L640 380"/>
</g>
<g fill="#475569" font-size="12">
<text x="190" y="188">1 join (QUSDC)</text><text x="186" y="236">1 joinWithQIE</text>
<text x="402" y="140">2 swap QIE→QUSDC</text>
<text x="500" y="58">3 max-in bound (Oracle)</text>
<text x="498" y="215">4 last seat: pay</text>
<text x="402" y="305">escrow held</text>
<text x="500" y="372">5 refund</text>
</g>
<text x="30" y="438" fill="#475569" font-size="12">Zone .qie names resolve the payee at create time (domainOwnerByName). The last seat's join pays the payee in the same transaction;</text>
<text x="30" y="456" fill="#475569" font-size="12">a pool past its deadline refunds every member.</text>
</svg>
